<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tareas del día</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="app">

    <header class="encabezado">
      <h1>Tareas del día</h1>
      <p id="fecha" class="fecha"></p>
      <div class="progreso">
        <progress id="barra-progreso" value="0" max="1"></progress>
        <span id="texto-progreso">0 de 0 completadas</span>
      </div>
    </header>

    <!-- Aquí aparecen los recordatorios cuando se agota el tiempo -->
    <section id="avisos" class="avisos" role="alert" aria-live="assertive"></section>

    <form id="formulario" class="formulario">
      <label class="campo campo-nombre">
        Tarea
        <input id="nombre-tarea" type="text" maxlength="60" placeholder="Ej: Revisar correos" required>
      </label>

      <label class="campo campo-duracion">
        Duración (min)
        <input id="duracion-tarea" type="number" min="1" max="600" value="25" required>
      </label>

      <button type="submit" class="boton boton-principal">Agregar</button>
    </form>

    <p id="mensaje-formulario" class="mensaje-formulario" aria-live="polite"></p>

    <ul id="lista-tareas" class="lista-tareas"></ul>

    <footer class="pie">
      <button id="boton-reiniciar" type="button" class="boton boton-secundario">Reiniciar el día</button>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
